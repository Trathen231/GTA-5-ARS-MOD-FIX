; MemoryOffsets.ini for the ARS FIX build (replaces the one shipped with the 2023 release).
; Normally leave everything at 0x0: ARS takes these offsets from ScriptHookVDotNet itself
; (SHVDN.NativeMemory.Vehicle), and if that fails, scans the game once with SHVDN's patterns.
; Every decision is written to scripts\ARS\Log.log as lines starting with [MEMORY].
;
; Values may be hex (0x9D4) or decimal (2516). A file value is only used if automatic resolution
; failed (or PreferFileOffsets=1), and only if it is 4-byte aligned and within 0x100..0x4000.
; The old shipped value Steer=0x2452 was never used by the original either (SHVDN's
; ScriptSettings.GetValue<ulong> turns any "0x..." string into 0), and it fails the alignment check.

[MEMORY_OFFSETS]
Steer=0x0
Throttle=0x0
Brake=0x0
; 1 = file values above win over automatic ones (still sanity-checked).
PreferFileOffsets=0
; 1 = try to re-derive the CWheel grip/wheelspin offsets (default: ARS's original 0x198 / 0x174).
; Experimental, off until a live probe confirms it.
UseScannedWheelOffsets=0
